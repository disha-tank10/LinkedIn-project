
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Profile - LinkedIn</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    {% include 'navbar.html' %}

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow-sm">

                    <div class="card-header bg-primary text-white p-3">
                        <h3 class="mb-0">Edit Profile</h3>
                    </div>

                    <div class="card-body p-4">

                        <form method="POST"
                              enctype="multipart/form-data">

                            <!-- Profile Photo -->
                            <div class="mb-4">
                                <label class="form-label">
                                    Profile Photo
                                </label>

                                <input type="file"
                                       name="profile_photo"
                                       class="form-control"
                                       accept="image/png,image/jpeg,image/webp,image/jfif">

                                <small class="text-muted">
                                    Upload jfif,JPG, PNG or WEBP (Max 5 MB)
                                </small>
                            </div>

                            <!-- About -->
                            <div class="mb-3">
                                <label class="form-label">About</label>

                                <textarea name="about"
                                          class="form-control"
                                          rows="4"
                                          placeholder="Tell us about yourself">{{ profile[0] if profile and profile[0] else '' }}</textarea>
                            </div>

                            <!-- Education -->
                            <div class="mb-3">
                                <label class="form-label">Education</label>

                                <input type="text"
                                       name="education"
                                       class="form-control"
                                       value="{{ profile[1] if profile and profile[1] else '' }}"
                                       placeholder="Enter your education">
                            </div>

                            <!-- Skills -->
                            <div class="mb-3">
                                <label class="form-label">Skills</label>

                                <input type="text"
                                       name="skills"
                                       class="form-control"
                                       value="{{ profile[2] if profile and profile[2] else '' }}"
                                       placeholder="Enter your skills">
                            </div>

                            <!-- Experience -->
                            <div class="mb-4">
                                <label class="form-label">Experience</label>

                                <input type="text"
                                       name="experience"
                                       class="form-control"
                                       value="{{ profile[3] if profile and profile[3] else '' }}"
                                       placeholder="Enter your experience">
                            </div>

                            <button type="submit"
                                    class="btn btn-primary w-100 mb-2">
                                Update Profile
                            </button>

                            <a href="{{ url_for('profile') }}"
                               class="btn btn-outline-secondary w-100">
                                Cancel
                            </a>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
